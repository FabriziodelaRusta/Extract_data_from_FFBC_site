
name: Velo Liberte - Export Palmarès

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executer l'export
        env:
          FFBC_USERNAME: ${{ secrets.FFBC_USERNAME }}
          FFBC_PASSWORD: ${{ secrets.FFBC_PASSWORD }}
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: python velo_liberte_palmares.py

      - name: Recuperer les fichiers CSV
        uses: actions/upload-artifact@v4
        with:
          name: RPA-participants-club
          path: output/*.csv
          if-no-files-found: error
          retention-days: 7
