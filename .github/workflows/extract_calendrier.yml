
name: Extraction calendrier FFBC

on:
  schedule:
    - cron: '15 5 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: extractions/calendrier/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r extractions/calendrier/requirements.txt

      - name: Creer le dossier de destination
        run: mkdir -p data/calendrier

      - name: Executer extraction
        run: |
          python -u extractions/calendrier/extract_calendrier.py

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendrier/
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour quotidienne du calendrier FFBC"
            git push
          else
            echo "Aucune modification des donnees"
          fi
